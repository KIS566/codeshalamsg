<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeShalaByKMFL - Claymorphism Chat</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <style>
        :root {
            /* Claymorphism Colors */
            --clay-bg: #f0f0f3;
            --clay-primary: #6c5ce7;
            --clay-secondary: #a29bfe;
            --clay-accent: #fd79a8;
            --clay-success: #00b894;
            --clay-warning: #fdcb6e;
            --clay-danger: #d63031;
            --clay-info: #0984e3;
            
            --clay-text: #2d3436;
            --clay-text-light: #636e72;
            --clay-white: #ffffff;
            
            /* Clay Shadows */
            --clay-shadow-outer: 20px 20px 60px #d9d9d9, -20px -20px 60px #ffffff;
            --clay-shadow-inner: inset 5px 5px 10px #d9d9d9, inset -5px -5px 10px #ffffff;
            --clay-shadow-small: 5px 5px 15px #d9d9d9, -5px -5px 15px #ffffff;
            --clay-shadow-medium: 10px 10px 30px #d9d9d9, -10px -10px 30px #ffffff;
            
            /* Dark Theme Colors */
            --clay-bg-dark: #2d3436;
            --clay-text-dark: #dfe6e9;
            --clay-text-light-dark: #b2bec3;
            --clay-white-dark: #353b48;
            --clay-shadow-outer-dark: 20px 20px 60px #23272e, -20px -20px 60px #3d434d;
            --clay-shadow-inner-dark: inset 5px 5px 10px #23272e, inset -5px -5px 10px #3d434d;
            --clay-shadow-small-dark: 5px 5px 15px #23272e, -5px -5px 15px #3d434d;
            --clay-shadow-medium-dark: 10px 10px 30px #23272e, -10px -10px 30px #3d434d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--clay-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: all 0.3s ease;
        }

        /* Dark Mode */
        body.dark-mode {
            background: var(--clay-bg-dark);
        }

        body.dark-mode .container {
            background: var(--clay-bg-dark);
        }

        body.dark-mode .header {
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
        }

        body.dark-mode .message:not(.own) .message-content {
            background: var(--clay-white-dark);
            color: var(--clay-text-dark);
            box-shadow: var(--clay-shadow-small-dark);
        }

        body.dark-mode .message-info strong {
            color: var(--clay-text-dark);
        }

        body.dark-mode .message-info span {
            color: var(--clay-text-light-dark);
        }

        body.dark-mode .input-area,
        body.dark-mode .tabs,
        body.dark-mode .sidebar {
            background: var(--clay-bg-dark);
            border-color: #3d434d;
        }

        body.dark-mode .tab {
            color: var(--clay-text-light-dark);
        }

        body.dark-mode .tab.active {
            color: var(--clay-secondary);
        }

        body.dark-mode .input-container input,
        body.dark-mode .input-container textarea {
            background: var(--clay-white-dark);
            color: var(--clay-text-dark);
            border-color: #3d434d;
            box-shadow: var(--clay-shadow-inner-dark);
        }

        body.dark-mode .input-container input::placeholder,
        body.dark-mode .input-container textarea::placeholder {
            color: var(--clay-text-light-dark);
        }

        body.dark-mode .online-users h3 {
            color: var(--clay-text-light-dark);
        }

        body.dark-mode .online-user-item .status {
            color: var(--clay-success);
        }

        body.dark-mode .user-name {
            color: var(--clay-text-dark);
        }

        body.dark-mode .user-email {
            color: var(--clay-text-light-dark);
        }

        body.dark-mode .emoji-picker {
            background: var(--clay-white-dark);
            border-color: #3d434d;
            box-shadow: var(--clay-shadow-medium-dark);
        }

        body.dark-mode .modal-content {
            background: var(--clay-white-dark);
            box-shadow: var(--clay-shadow-medium-dark);
        }

        body.dark-mode .modal-content h3 {
            color: var(--clay-text-dark);
        }

        body.dark-mode .modal-content p {
            color: var(--clay-text-light-dark);
        }

        .container {
            background: var(--clay-bg);
            border-radius: 30px;
            box-shadow: var(--clay-shadow-outer);
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--clay-bg);
            border-right: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 15px;
            border-radius: 20px;
            background: var(--clay-bg);
            box-shadow: var(--clay-shadow-small);
            transition: all 0.3s ease;
        }

        .user-profile:hover {
            box-shadow: var(--clay-shadow-medium);
            transform: translateY(-2px);
        }

        .user-profile:active {
            box-shadow: var(--clay-shadow-inner);
            transform: translateY(0);
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 15px;
            cursor: pointer;
            position: relative;
            box-shadow: var(--clay-shadow-small);
        }

        .online-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            background: var(--clay-success);
            border-radius: 50%;
            border: 3px solid var(--clay-bg);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 184, 148, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 184, 148, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 184, 148, 0); }
        }

        .user-name {
            font-weight: 600;
            color: var(--clay-text);
            font-size: 14px;
        }

        .user-email {
            font-size: 11px;
            color: var(--clay-text-light);
        }

        .online-users {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .online-users h3 {
            font-size: 13px;
            color: var(--clay-text-light);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .online-user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .online-user-item:hover {
            background: var(--clay-bg);
            box-shadow: var(--clay-shadow-small);
            transform: translateX(5px);
        }

        .online-user-item img {
            width: 35px;
            height: 35px;
            border-radius: 12px;
            box-shadow: var(--clay-shadow-small);
        }

        .online-user-item .status {
            font-size: 11px;
            color: var(--clay-success);
            font-weight: 600;
        }

        .sidebar-footer {
            padding: 15px;
        }

        .theme-toggle {
            width: 100%;
            padding: 12px;
            background: var(--clay-bg);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            color: var(--clay-text);
            font-weight: 600;
            box-shadow: var(--clay-shadow-small);
            transition: all 0.3s ease;
            font-size: 13px;
        }

        .theme-toggle:hover {
            box-shadow: var(--clay-shadow-medium);
            transform: translateY(-2px);
        }

        .theme-toggle:active {
            box-shadow: var(--clay-shadow-inner);
            transform: translateY(0);
        }

        /* Main Chat Area */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 30px 0 0 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-left h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .header-left p {
            font-size: 12px;
            opacity: 0.9;
        }

        .menu-btn {
            display: none;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .menu-btn:active {
            transform: scale(0.9);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .action-btn:active {
            transform: scale(0.9);
        }

        .logout-btn {
            background: var(--clay-accent);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(253, 121, 168, 0.4);
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(253, 121, 168, 0.6);
        }

        .logout-btn:active {
            transform: scale(0.95);
        }

        /* Search Bar */
        .search-bar {
            padding: 15px 20px;
            background: var(--clay-bg);
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            display: none;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 15px;
            font-size: 14px;
            outline: none;
            background: var(--clay-bg);
            color: var(--clay-text);
            box-shadow: var(--clay-shadow-inner);
            transition: all 0.3s ease;
        }

        body.dark-mode .search-bar input {
            background: var(--clay-white-dark);
            color: var(--clay-text-dark);
            box-shadow: var(--clay-shadow-inner-dark);
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: var(--clay-bg);
            padding: 15px;
            gap: 10px;
            overflow-x: auto;
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 10px 18px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: var(--clay-text-light);
            transition: all 0.3s ease;
            white-space: nowrap;
            border-radius: 15px;
            background: var(--clay-bg);
            box-shadow: var(--clay-shadow-small);
            font-size: 13px;
            position: relative;
        }

        .tab:hover {
            transform: translateY(-2px);
        }

        .tab.active {
            color: var(--clay-primary);
            box-shadow: var(--clay-shadow-inner);
            background: linear-gradient(145deg, #f0f0f3, #ffffff);
        }

        body.dark-mode .tab.active {
            background: linear-gradient(145deg, #2d3436, #353b48);
            color: var(--clay-secondary);
        }

        .tab .badge {
            background: var(--clay-accent);
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 10px;
            margin-left: 5px;
        }

        /* Pinned Message */
        .pinned-message {
            background: linear-gradient(135deg, #fdcb6e 0%, #f39c12 100%);
            border-radius: 15px;
            padding: 12px 18px;
            margin: 10px 20px;
            position: sticky;
            top: 10px;
            z-index: 100;
            display: none;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
        }

        /* Messages Area */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            align-items: flex-end;
        }

        .message-wrapper {
            display: flex;
            gap: 12px;
            max-width: 80%;
            align-items: flex-start;
        }

        .message.own .message-wrapper {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 15px;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: var(--clay-shadow-small);
        }

        .message-body {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }

        .message-content {
            padding: 15px;
            border-radius: 20px;
            position: relative;
            word-wrap: break-word;
            color: var(--clay-text);
            box-shadow: var(--clay-shadow-small);
            transition: all 0.3s ease;
        }

        .message.own .message-content {
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            color: white;
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .message:not(.own) .message-content {
            background: var(--clay-bg);
            border-bottom-left-radius: 5px;
        }

        .message-info {
            font-size: 11px;
            color: var(--clay-text-light);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .message-info strong {
            color: var(--clay-text);
            font-weight: 600;
        }

        .message-time {
            font-size: 10px;
            color: var(--clay-text-light);
            opacity: 0.8;
        }

        .message-actions {
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s ease;
            margin-top: 5px;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .msg-action-btn {
            background: var(--clay-bg);
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 5px 8px;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: var(--clay-shadow-small);
        }

        .msg-action-btn:hover {
            transform: scale(1.1);
        }

        .msg-action-btn:active {
            box-shadow: var(--clay-shadow-inner);
            transform: scale(0.95);
        }

        /* Reactions */
        .reactions {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .reaction {
            background: var(--clay-bg);
            border: none;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--clay-shadow-small);
        }

        .reaction:hover {
            transform: scale(1.1);
        }

        .reaction:active {
            box-shadow: var(--clay-shadow-inner);
            transform: scale(0.95);
        }

        /* Typing Indicator */
        .typing-indicator {
            padding: 10px 20px;
            font-style: italic;
            color: var(--clay-text-light);
            display: none;
            font-size: 13px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: var(--clay-bg);
            border-top: 2px solid rgba(255, 255, 255, 0.5);
        }

        .reply-preview {
            background: var(--clay-bg);
            border-left: 4px solid var(--clay-primary);
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: none;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--clay-shadow-small);
        }

        .reply-preview .reply-text {
            color: var(--clay-text-light);
            font-size: 13px;
        }

        .cancel-reply {
            background: none;
            border: none;
            color: var(--clay-accent);
            cursor: pointer;
            font-size: 18px;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .emoji-btn, .file-btn {
            background: var(--clay-bg);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
            box-shadow: var(--clay-shadow-small);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .emoji-btn:hover, .file-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--clay-shadow-medium);
        }

        .emoji-btn:active, .file-btn:active {
            box-shadow: var(--clay-shadow-inner);
            transform: scale(0.95);
        }

        .input-container input,
        .input-container textarea {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            background: var(--clay-bg);
            color: var(--clay-text);
            resize: none;
            max-height: 100px;
            box-shadow: var(--clay-shadow-inner);
            transition: all 0.3s ease;
        }

        .input-container input:focus,
        .input-container textarea:focus {
            box-shadow: var(--clay-shadow-inner), 0 0 0 2px var(--clay-primary);
        }

        .input-container input::placeholder,
        .input-container textarea::placeholder {
            color: var(--clay-text-light);
        }

        .send-btn {
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 22px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
        }

        .send-btn:active {
            transform: scale(0.9);
        }

        /* Emoji Picker */
        .emoji-picker {
            position: absolute;
            bottom: 100px;
            left: 20px;
            background: var(--clay-bg);
            border-radius: 25px;
            padding: 20px;
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            width: 320px;
            box-shadow: var(--clay-shadow-outer);
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .emoji-picker span {
            font-size: 28px;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .emoji-picker span:hover {
            background: var(--clay-bg);
            box-shadow: var(--clay-shadow-small);
            transform: scale(1.2);
        }

        /* File Preview */
        .file-preview {
            max-width: 300px;
            border-radius: 15px;
            margin-top: 10px;
        }

        .file-preview img {
            width: 100%;
            border-radius: 15px;
            box-shadow: var(--clay-shadow-small);
        }

        .file-preview a {
            color: var(--clay-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            background: var(--clay-bg);
            border-radius: 12px;
            box-shadow: var(--clay-shadow-small);
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--clay-bg);
            border-radius: 30px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: var(--clay-shadow-outer);
            animation: slideUp 0.3s ease;
        }

        .modal-content img {
            width: 90px;
            height: 90px;
            border-radius: 25px;
            margin-bottom: 20px;
            box-shadow: var(--clay-shadow-small);
        }

        .modal-content h3 {
            color: var(--clay-text);
            margin-bottom: 10px;
            font-size: 20px;
        }

        .modal-content p {
            color: var(--clay-text-light);
            margin-bottom: 15px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--clay-bg);
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--clay-text-light);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            box-shadow: var(--clay-shadow-small);
            transition: all 0.3s ease;
        }

        .modal-close:active {
            box-shadow: var(--clay-shadow-inner);
            transform: scale(0.9);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--clay-secondary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--clay-primary);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .container {
                height: 100vh;
                border-radius: 0;
                position: relative;
            }

            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                bottom: 0;
                z-index: 1000;
                transition: left 0.3s ease;
                box-shadow: var(--clay-shadow-outer);
            }

            .sidebar.active {
                left: 0;
            }

            .menu-btn {
                display: block;
            }

            .header {
                border-radius: 0;
                padding: 15px;
            }

            .header-left h1 {
                font-size: 18px;
            }

            .header-left p {
                font-size: 10px;
            }

            .message-wrapper {
                max-width: 90%;
            }

            .message-content {
                padding: 12px;
                font-size: 14px;
            }

            .message-avatar {
                width: 35px;
                height: 35px;
            }

            .emoji-picker {
                width: 280px;
                left: 10px;
                bottom: 90px;
            }

            .input-area {
                padding: 15px;
            }

            .input-container input,
            .input-container textarea {
                font-size: 16px; /* Prevent zoom on iOS */
            }

            .tab {
                padding: 8px 14px;
                font-size: 12px;
            }

            .action-btn {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }
        }

        /* Small Mobile */
        @media (max-width: 480px) {
            .header {
                padding: 12px;
            }

            .header-left h1 {
                font-size: 16px;
            }

            .header-actions {
                gap: 5px;
            }

            .action-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }

            .logout-btn {
                padding: 8px 12px;
                font-size: 11px;
            }

            .messages {
                padding: 15px;
            }

            .message {
                margin-bottom: 20px;
            }

            .emoji-btn, .file-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .send-btn {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="user-profile" onclick="showUserProfile()">
                    <div style="position: relative;">
                        <img id="sidebarUserPhoto" src="" alt="" class="user-avatar">
                        <span class="online-dot"></span>
                    </div>
                    <div>
                        <div class="user-name" id="sidebarUserName"></div>
                        <div class="user-email" id="sidebarUserEmail"></div>
                    </div>
                </div>
            </div>
            <div class="online-users">
                <h3>🟢 Online Users</h3>
                <div id="onlineUsersList"></div>
            </div>
            <div class="sidebar-footer">
                <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
                <button class="theme-toggle" onclick="logout()" style="margin-top: 10px; color: var(--clay-accent);">🚪 Logout</button>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-chat">
            <div class="header">
                <div class="header-left">
                    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                    <div>
                        <h1>🚀 CodeShalaByKMFL</h1>
                        <p>Advanced Claymorphism Chat</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="action-btn" onclick="toggleSearch()">🔍</button>
                    <button class="action-btn" onclick="toggleEmojiPicker()">😊</button>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-bar" id="searchBar">
                <input type="text" id="searchInput" placeholder="🔍 Search messages..." oninput="searchMessages(this.value)">
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" onclick="switchTab('general', this)">
                    💬 General
                </div>
                <div class="tab" onclick="switchTab('questions', this)">
                    ❓ Questions
                </div>
                <div class="tab" onclick="switchTab('announcements', this)">
                    📢 Announcements
                </div>
                <div class="tab" onclick="switchTab('study-material', this)">
                    📚 Study Material
                </div>
                <div class="tab" onclick="switchTab('off-topic', this)">
                    🎮 Off Topic
                </div>
            </div>

            <!-- Pinned Message -->
            <div class="pinned-message" id="pinnedMessage">
                <span>📌 <span id="pinnedText"></span></span>
                <button onclick="unpinMessage()" style="background: none; border: none; cursor: pointer; color: white; font-size: 18px;">✖</button>
            </div>

            <!-- Messages -->
            <div class="messages" id="messages">
                <div style="text-align: center; color: var(--clay-text-light); padding: 60px 20px;">
                    <div style="font-size: 60px; margin-bottom: 20px;">💬</div>
                    <h3 style="color: var(--clay-text); margin-bottom: 10px;">Welcome to CodeShala!</h3>
                    <p>Start chatting with your classmates</p>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <span id="typingText"></span>
            </div>

            <!-- Reply Preview -->
            <div class="reply-preview" id="replyPreview">
                <span class="reply-text" id="replyText"></span>
                <button class="cancel-reply" onclick="cancelReply()">✖</button>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container">
                    <button class="emoji-btn" onclick="toggleEmojiPicker()">😊</button>
                    <button class="file-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                    <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">
                    <textarea id="messageInput" placeholder="Type your message..." rows="1" onkeypress="handleKeyPress(event)" oninput="autoResize(this)"></textarea>
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </div>

            <!-- Emoji Picker -->
            <div class="emoji-picker" id="emojiPicker">
                <span onclick="addEmoji('😀')">😀</span>
                <span onclick="addEmoji('😂')">😂</span>
                <span onclick="addEmoji('😊')">😊</span>
                <span onclick="addEmoji('😍')">😍</span>
                <span onclick="addEmoji('🤔')">🤔</span>
                <span onclick="addEmoji('👍')">👍</span>
                <span onclick="addEmoji('👎')">👎</span>
                <span onclick="addEmoji('👏')">👏</span>
                <span onclick="addEmoji('🙏')">🙏</span>
                <span onclick="addEmoji('💪')">💪</span>
                <span onclick="addEmoji('🎉')">🎉</span>
                <span onclick="addEmoji('❤️')">❤️</span>
                <span onclick="addEmoji('🔥')">🔥</span>
                <span onclick="addEmoji('⭐')">⭐</span>
                <span onclick="addEmoji('📚')">📚</span>
                <span onclick="addEmoji('💡')">💡</span>
                <span onclick="addEmoji('❓')">❓</span>
                <span onclick="addEmoji('✅')">✅</span>
                <span onclick="addEmoji('⏰')">⏰</span>
                <span onclick="addEmoji('📝')">📝</span>
            </div>
        </div>
    </div>

    <!-- User Profile Modal -->
    <div class="modal" id="userProfileModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeUserProfile()">✖</button>
            <img id="modalUserPhoto" src="" alt="">
            <h3 id="modalUserName"></h3>
            <p id="modalUserEmail"></p>
            <p id="modalUserStatus" style="color: var(--clay-success); font-weight: 600;">● Online</p>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCuuUwd7TINIAwlLxg-OYjo7Q-1cBsbU5I",
            authDomain: "codeshalatest.firebaseapp.com",
            databaseURL: "https://codeshalatest-default-rtdb.firebaseio.com",
            projectId: "codeshalatest",
            storageBucket: "codeshalatest.firebasestorage.app",
            messagingSenderId: "63047132068",
            appId: "1:63047132068:web:b5eb1269a25ea412ed5731"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const storage = firebase.storage();

        // Admin email
        const ADMIN_EMAIL = "aapkaemail@gmail.com"; // ⚠️ APNA EMAIL DALO

        let currentUser = null;
        let currentTab = 'general';
        let messagesRef = null;
        let typingRef = null;
        let presenceRef = null;
        let replyingTo = null;
        let pinnedMessageId = null;
        let currentFile = null;

        // Auth State
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                initializeChat();
            } else {
                currentUser = null;
                // Redirect to login
                window.location.href = 'login.html';
            }
        });

        function initializeChat() {
            // Update sidebar user info
            document.getElementById('sidebarUserPhoto').src = currentUser.photoURL || `https://ui-avatars.com/api/?name=${currentUser.displayName}`;
            document.getElementById('sidebarUserName').textContent = currentUser.displayName;
            document.getElementById('sidebarUserEmail').textContent = currentUser.email;

            // Set presence
            presenceRef = database.ref('presence/' + currentUser.uid);
            presenceRef.set({
                name: currentUser.displayName,
                email: currentUser.email,
                photoURL: currentUser.photoURL,
                online: true,
                lastSeen: Date.now()
            });
            presenceRef.onDisconnect().update({ online: false, lastSeen: Date.now() });

            // Load data
            loadOnlineUsers();
            loadMessages();
            loadPinnedMessage();
            setupTypingIndicator();
        }

        // Load Online Users
        function loadOnlineUsers() {
            database.ref('presence').on('value', (snapshot) => {
                const onlineUsersDiv = document.getElementById('onlineUsersList');
                onlineUsersDiv.innerHTML = '';
                
                snapshot.forEach((child) => {
                    const user = child.val();
                    if (user.online) {
                        const userDiv = document.createElement('div');
                        userDiv.className = 'online-user-item';
                        userDiv.onclick = () => showUserProfile(user);
                        userDiv.innerHTML = `
                            <img src="${user.photoURL || `https://ui-avatars.com/api/?name=${user.name}`}" alt="">
                            <div>
                                <div style="font-weight: 600; color: var(--clay-text); font-size: 13px;">${user.name}</div>
                                <div class="status">● Online</div>
                            </div>
                        `;
                        onlineUsersDiv.appendChild(userDiv);
                    }
                });
            });
        }

        // Load Messages
        function loadMessages() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '<div style="text-align: center; color: var(--clay-text-light);">Loading messages...</div>';

            if (messagesRef) {
                messagesRef.off();
            }

            messagesRef = database.ref('messages/' + currentTab);
            
            messagesRef.orderByChild('timestamp').limitToLast(100).on('value', (snapshot) => {
                messagesDiv.innerHTML = '';
                
                if (!snapshot.exists()) {
                    messagesDiv.innerHTML = '<div style="text-align: center; color: var(--clay-text-light); padding: 40px;">No messages yet. Start the conversation! 💬</div>';
                    return;
                }

                const messages = [];
                snapshot.forEach((child) => {
                    messages.push({ id: child.key, ...child.val() });
                });

                messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                messages.forEach((msg) => {
                    displayMessage(msg);
                });

                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
        }

        // Display Message
        function displayMessage(msg) {
            const messagesDiv = document.getElementById('messages');
            
            if (messagesDiv.innerHTML.includes('No messages yet')) {
                messagesDiv.innerHTML = '';
            }

            const isOwn = msg.userId === currentUser.uid;
            const isAdmin = msg.email === ADMIN_EMAIL;
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message' + (isOwn ? ' own' : '');
            messageDiv.id = msg.id;

            const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';
            const date = msg.timestamp ? new Date(msg.timestamp).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '';

            let fileHtml = '';
            if (msg.fileURL) {
                if (msg.fileType === 'image') {
                    fileHtml = `<img src="${msg.fileURL}" class="file-preview" onclick="window.open('${msg.fileURL}', '_blank')">`;
                } else {
                    fileHtml = `<a href="${msg.fileURL}" target="_blank" class="file-preview">📎 ${msg.fileName}</a>`;
                }
            }

            let replyHtml = '';
            if (msg.replyTo) {
                replyHtml = `<div style="background: rgba(108, 92, 231, 0.1); padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 12px;">
                    ↩️ Replying to ${msg.replyTo.name}: ${msg.replyTo.text.substring(0, 50)}
                </div>`;
            }

            let reactionsHtml = '';
            if (msg.reactions) {
                reactionsHtml = '<div class="reactions">';
                Object.entries(msg.reactions).forEach(([emoji, count]) => {
                    reactionsHtml += `<span class="reaction" onclick="reactToMessage('${msg.id}', '${emoji}')">${emoji} ${count}</span>`;
                });
                reactionsHtml += '</div>';
            }

            messageDiv.innerHTML = `
                <div class="message-wrapper">
                    <img src="${msg.photoURL || `https://ui-avatars.com/api/?name=${msg.name}`}" alt="" class="message-avatar" onclick="showUserProfile({name: '${msg.name}', email: '${msg.email}', photoURL: '${msg.photoURL}'})">
                    <div class="message-body">
                        <div class="message-info">
                            <strong>${msg.name}</strong>
                            ${isAdmin ? '<span style="background: var(--clay-warning); color: white; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold;">ADMIN</span>' : ''}
                            <span>${date} ${time}</span>
                        </div>
                        <div class="message-content">
                            ${replyHtml}
                            ${escapeHtml(msg.text || '')}
                            ${fileHtml}
                        </div>
                        ${reactionsHtml}
                        <div class="message-actions">
                            <button class="msg-action-btn" onclick="replyToMessage('${msg.id}')" title="Reply">↩️</button>
                            <button class="msg-action-btn" onclick="reactToMessage('${msg.id}', '👍')" title="Like">👍</button>
                            <button class="msg-action-btn" onclick="reactToMessage('${msg.id}', '❤️')" title="Love">❤️</button>
                            <button class="msg-action-btn" onclick="reactToMessage('${msg.id}', '😂')" title="Haha">😂</button>
                            ${isAdmin ? `<button class="msg-action-btn" onclick="pinMessage('${msg.id}')" title="Pin">📌</button>` : ''}
                            ${(isOwn || isAdmin) ? `<button class="msg-action-btn" onclick="deleteMessage('${msg.id}')" title="Delete">🗑️</button>` : ''}
                        </div>
                    </div>
                </div>
            `;

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Send Message
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text && !currentFile) return;
            if (!currentUser) return;

            const messageData = {
                text: text || '',
                name: currentUser.displayName || 'Anonymous',
                email: currentUser.email,
                photoURL: currentUser.photoURL || '',
                userId: currentUser.uid,
                timestamp: Date.now()
            };

            if (replyingTo) {
                messageData.replyTo = {
                    name: replyingTo.name,
                    text: replyingTo.text.substring(0, 100)
                };
            }

            if (currentFile) {
                uploadFileAndSend(messageData);
            } else {
                messagesRef.push(messageData);
                input.value = '';
                cancelReply();
            }
        }

        // File Upload
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                currentFile = file;
                document.getElementById('messageInput').placeholder = `📎 ${file.name} (Click send to upload)`;
            }
        }

        function uploadFileAndSend(messageData) {
            const storageRef = storage.ref('chat-files/' + Date.now() + '-' + currentFile.name);
            const uploadTask = storageRef.put(currentFile);

            uploadTask.on('state_changed',
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    document.getElementById('messageInput').placeholder = `Uploading... ${Math.round(progress)}%`;
                },
                (error) => {
                    console.error('Upload error:', error);
                    alert('File upload failed!');
                },
                () => {
                    uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                        messageData.fileURL = downloadURL;
                        messageData.fileName = currentFile.name;
                        messageData.fileType = currentFile.type.startsWith('image/') ? 'image' : 'file';
                        
                        messagesRef.push(messageData);
                        currentFile = null;
                        document.getElementById('fileInput').value = '';
                        document.getElementById('messageInput').value = '';
                        document.getElementById('messageInput').placeholder = 'Type your message...';
                        cancelReply();
                    });
                }
            );
        }

        // Reply System
        function replyToMessage(messageId) {
            database.ref('messages/' + currentTab + '/' + messageId).once('value', (snapshot) => {
                const msg = snapshot.val();
                if (msg) {
                    replyingTo = { name: msg.name, text: msg.text };
                    document.getElementById('replyPreview').style.display = 'flex';
                    document.getElementById('replyText').textContent = `Replying to ${msg.name}: ${msg.text.substring(0, 50)}...`;
                    document.getElementById('messageInput').focus();
                }
            });
        }

        function cancelReply() {
            replyingTo = null;
            document.getElementById('replyPreview').style.display = 'none';
        }

        // Reactions
        function reactToMessage(messageId, emoji) {
            const messageRef = database.ref('messages/' + currentTab + '/' + messageId);
            messageRef.once('value', (snapshot) => {
                const msg = snapshot.val();
                if (msg) {
                    const reactions = msg.reactions || {};
                    if (!reactions[emoji]) {
                        reactions[emoji] = 1;
                    } else {
                        reactions[emoji]++;
                    }
                    messageRef.update({ reactions: reactions });
                }
            });
        }

        // Pin Message
        function pinMessage(messageId) {
            database.ref('messages/' + currentTab + '/' + messageId).once('value', (snapshot) => {
                const msg = snapshot.val();
                if (msg) {
                    pinnedMessageId = messageId;
                    database.ref('pinned/' + currentTab).set({
                        messageId: messageId,
                        text: msg.text,
                        pinnedBy: currentUser.displayName,
                        timestamp: Date.now()
                    });
                }
            });
        }

        function loadPinnedMessage() {
            database.ref('pinned/' + currentTab).on('value', (snapshot) => {
                const pinned = snapshot.val();
                if (pinned) {
                    document.getElementById('pinnedMessage').style.display = 'flex';
                    document.getElementById('pinnedText').textContent = pinned.text;
                    pinnedMessageId = pinned.messageId;
                } else {
                    document.getElementById('pinnedMessage').style.display = 'none';
                }
            });
        }

        function unpinMessage() {
            database.ref('pinned/' + currentTab).remove();
        }

        // Delete Message
        function deleteMessage(messageId) {
            if (confirm('Delete this message?')) {
                database.ref('messages/' + currentTab + '/' + messageId).remove();
            }
        }

        // Typing Indicator
        function setupTypingIndicator() {
            typingRef = database.ref('typing/' + currentTab + '/' + currentUser.uid);
            typingRef.onDisconnect().remove();

            const input = document.getElementById('messageInput');
            let typingTimeout;

            input.addEventListener('input', () => {
                typingRef.set({
                    name: currentUser.displayName,
                    timestamp: Date.now()
                });

                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    typingRef.remove();
                }, 2000);
            });

            database.ref('typing/' + currentTab).on('value', (snapshot) => {
                const typingUsers = [];
                snapshot.forEach((child) => {
                    const user = child.val();
                    if (child.key !== currentUser.uid && user.timestamp > Date.now() - 2000) {
                        typingUsers.push(user.name);
                    }
                });

                const typingIndicator = document.getElementById('typingIndicator');
                if (typingUsers.length > 0) {
                    typingIndicator.style.display = 'block';
                    document.getElementById('typingText').textContent = 
                        typingUsers.length === 1 ? 
                        `${typingUsers[0]} is typing...` : 
                        `${typingUsers.length} people are typing...`;
                } else {
                    typingIndicator.style.display = 'none';
                }
            });
        }

        // Switch Tab
        function switchTab(tab, element) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            loadMessages();
            loadPinnedMessage();
            setupTypingIndicator();
        }

        // Theme Toggle
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
        }

        // Emoji Picker
        function toggleEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.style.display = picker.style.display === 'flex' ? 'none' : 'flex';
        }

        function addEmoji(emoji) {
            const input = document.getElementById('messageInput');
            input.value += emoji;
            input.focus();
        }

        // Search
        function toggleSearch() {
            const searchBar = document.getElementById('searchBar');
            searchBar.style.display = searchBar.style.display === 'block' ? 'none' : 'block';
            if (searchBar.style.display === 'block') {
                document.getElementById('searchInput').focus();
            }
        }

        function searchMessages(query) {
            if (!query) {
                loadMessages();
                return;
            }

            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '<div style="text-align: center; color: var(--clay-text-light);">Searching...</div>';

            messagesRef.orderByChild('timestamp').limitToLast(500).on('value', (snapshot) => {
                messagesDiv.innerHTML = '';
                let found = false;

                snapshot.forEach((child) => {
                    const msg = child.val();
                    if (msg.text && msg.text.toLowerCase().includes(query.toLowerCase())) {
                        displayMessage({ id: child.key, ...msg });
                        found = true;
                    }
                });

                if (!found) {
                    messagesDiv.innerHTML = '<div style="text-align: center; color: var(--clay-text-light); padding: 40px;">No messages found</div>';
                }
            });
        }

        // User Profile Modal
        function showUserProfile(user) {
            document.getElementById('modalUserPhoto').src = user.photoURL || `https://ui-avatars.com/api/?name=${user.name}`;
            document.getElementById('modalUserName').textContent = user.name;
            document.getElementById('modalUserEmail').textContent = user.email;
            document.getElementById('userProfileModal').style.display = 'flex';
        }

        function closeUserProfile() {
            document.getElementById('userProfileModal').style.display = 'none';
        }

        // Sidebar Toggle
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // Keyboard Handlers
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
        }

        // Utility
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Logout
        function logout() {
            if (presenceRef) {
                presenceRef.update({ online: false });
            }
            auth.signOut();
        }

        // Close sidebar on mobile when clicking outside
        document.addEventListener('click', (event) => {
            const sidebar = document.getElementById('sidebar');
            const menuBtn = document.querySelector('.menu-btn');
            
            if (window.innerWidth <= 768) {
                if (sidebar.classList.contains('active') && 
                    !sidebar.contains(event.target) && 
                    !menuBtn.contains(event.target)) {
                    sidebar.classList.remove('active');
                }
            }
        });
    </script>
</body>
</html>
