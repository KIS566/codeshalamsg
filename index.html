<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeShalaByKMFL - Chat</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Login Section */
        .login-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .login-section h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .login-section p {
            color: #666;
            margin-bottom: 30px;
        }

        .google-btn {
            background: white;
            border: 2px solid #ddd;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            font-weight: 600;
            color: #333;
        }

        .google-btn:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }

        /* Chat Section */
        .chat-section {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid white;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            font-size: 13px;
        }

        .tab:hover {
            background: #ebebeb;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.own {
            align-items: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
        }

        .message.own .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message:not(.own) .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 5px;
        }

        .message-info {
            font-size: 11px;
            color: #999;
            margin-bottom: 5px;
        }

        .input-section {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        .input-section input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
        }

        .input-section input:focus {
            border-color: #667eea;
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 600px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }
            
            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div class="login-section" id="loginSection">
            <h2>🚀 CodeShalaByKMFL</h2>
            <p>Student Community - Login karke chat shuru karo!</p>
            <button class="google-btn" onclick="loginWithGoogle()">
                <svg width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                </svg>
                Google se Login Kare
            </button>
        </div>

        <!-- Chat Section -->
        <div class="chat-section" id="chatSection">
            <div class="header">
                <h1>🚀 CodeShalaByKMFL</h1>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('general', this)">💬 General</div>
                <div class="tab" onclick="switchTab('questions', this)">❓ Questions</div>
                <div class="tab" onclick="switchTab('announcements', this)">📢 Announcements</div>
            </div>

            <div class="messages" id="messages">
                <div style="text-align: center; color: #999; padding: 40px;">Welcome! Messages yahan dikhenge.</div>
            </div>

            <div class="input-section">
                <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">Send 📤</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCuuUwd7TINIAwlLxg-OYjo7Q-1cBsbU5I",
            authDomain: "codeshalatest.firebaseapp.com",
            databaseURL: "https://codeshalatest-default-rtdb.firebaseio.com",
            projectId: "codeshalatest",
            storageBucket: "codeshalatest.firebasestorage.app",
            messagingSenderId: "63047132068",
            appId: "1:63047132068:web:b5eb1269a25ea412ed5731"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;
        let currentTab = 'general';
        let messagesRef = null;

        // Auth State
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                showChat();
                loadMessages();
            } else {
                currentUser = null;
                showLogin();
            }
        });

        function showLogin() {
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('chatSection').style.display = 'none';
        }

        function showChat() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('chatSection').style.display = 'flex';
        }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(() => {
                    console.log("Login successful!");
                })
                .catch((error) => {
                    console.error("Login error:", error);
                    alert("Login failed!");
                });
        }

        function logout() {
            auth.signOut();
        }

        function switchTab(tab, element) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            loadMessages();
        }

        function loadMessages() {
            if (!currentUser) return;

            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '<div style="text-align: center; color: #999;">Loading...</div>';

            messagesRef = database.ref('messages/' + currentTab);
            messagesRef.off();

            messagesRef.orderByChild('timestamp').limitToLast(100).on('value', (snapshot) => {
                messagesDiv.innerHTML = '';

                if (!snapshot.exists()) {
                    messagesDiv.innerHTML = '<div style="text-align: center; color: #999; padding: 40px;">No messages yet. Start chatting! 💬</div>';
                    return;
                }

                const messages = [];
                snapshot.forEach((child) => {
                    messages.push({ id: child.key, ...child.val() });
                });

                messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                messages.forEach((msg) => {
                    displayMessage(msg);
                });

                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
        }

        function displayMessage(msg) {
            const messagesDiv = document.getElementById('messages');
            
            if (messagesDiv.innerHTML.includes('No messages yet')) {
                messagesDiv.innerHTML = '';
            }

            const isOwn = msg.userId === currentUser.uid;
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message' + (isOwn ? ' own' : '');

            const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';

            messageDiv.innerHTML = `
                <div class="message-info">
                    ${msg.name} • ${time}
                </div>
                <div class="message-content">${escapeHtml(msg.text)}</div>
            `;

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text || !currentUser) return;

            const messageData = {
                text: text,
                name: currentUser.displayName || 'Anonymous',
                email: currentUser.email,
                photoURL: currentUser.photoURL || '',
                userId: currentUser.uid,
                timestamp: Date.now()
            };

            messagesRef.push(messageData)
                .then(() => {
                    input.value = '';
                    input.focus();
                })
                .catch((error) => {
                    console.error("Send error:", error);
                    alert("Message send nahi hua!");
                });
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
